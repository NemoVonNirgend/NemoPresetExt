name: Stage 5B.2 isolated workspace
on:
  push:
    branches: [perf/stage5b2-state-consumers]
    paths: [.github/workflows/stage5b2-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source for local validation
        run: tar --exclude=.git -czf /tmp/nemo-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: stage5b2-source
          path: /tmp/nemo-source.tar.gz
          retention-days: 1
