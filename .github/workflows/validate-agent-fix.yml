name: Validate agent fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Node test suite
        run: node --test tests/*.test.js

      - name: Create repository snapshot
        run: git archive --format=zip --output=nemo-preset-ext-source.zip HEAD

      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nemo-preset-ext-source
          path: nemo-preset-ext-source.zip
          if-no-files-found: error
          retention-days: 1
