name: Post-merge regression audit

on:
  push:
    branches:
      - audit/post-merge-2026-08-07
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out NemoPresetExt audit branch
        uses: actions/checkout@v4
        with:
          path: repos/NemoPresetExt
          fetch-depth: 1
          persist-credentials: false

      - name: Check out NemoPromptTools 1.2.1 main
        uses: actions/checkout@v4
        with:
          repository: NemoVonNirgend/NemoPromptTools
          ref: da0729b225f45da10bd49dc7c9474835c22c83e1
          path: repos/NemoPromptTools
          fetch-depth: 1
          persist-credentials: false

      - name: Check out NemoUIOverhaul 1.2.1 main
        uses: actions/checkout@v4
        with:
          repository: NemoVonNirgend/NemoUIOverhaul
          ref: c87822664d7bd66e3ad3ad392a2b55ab5a1408e3
          path: repos/NemoUIOverhaul
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit parser
        run: python -m pip install --disable-pip-version-check tinycss2==1.4.0

      - name: Audit all three repositories
        id: audit
        continue-on-error: true
        run: |
          python repos/NemoPresetExt/scripts/final_release_audit.py \
            "$GITHUB_WORKSPACE/repos" \
            "$GITHUB_WORKSPACE/final-release-audit.json"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nemo-final-release-audit
          path: |
            final-release-audit.json
            final-release-audit.md
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce audit result
        if: steps.audit.outcome == 'failure'
        run: exit 1
