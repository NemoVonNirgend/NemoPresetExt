name: Nemo recipe runtime acceptance

on:
  pull_request:
    paths:
      - 'features/preset-runtime/**'
      - 'tests/recipe-*'
      - 'content.js'
      - 'manifest.json'
      - 'docs/RECIPE_RUNTIME_STAGE_1.md'
      - '.github/workflows/recipe-runtime-ci.yml'
  push:
    branches: [main]
    paths:
      - 'features/preset-runtime/**'
      - 'tests/recipe-*'
      - 'content.js'
      - 'manifest.json'
      - 'docs/RECIPE_RUNTIME_STAGE_1.md'
      - '.github/workflows/recipe-runtime-ci.yml'

permissions:
  contents: read

jobs:
  recipe-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/nemo-review"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/nemo-review/NemoPresetExt-source.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/nemo-review/commit.txt"
      - name: Recipe contracts
        run: |
          set -o pipefail
          node --test tests/recipe-*.test.js | tee "$RUNNER_TEMP/nemo-review/node-tests.txt"
      - name: Install browser harness
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Synthetic full-size corpus
        run: node tests/recipe-stress-fixture.js "$RUNNER_TEMP/Nemo-QA-Full.json"
      - name: Browser worker and import-export acceptance
        run: python tests/recipe-browser-smoke.py --preset "$RUNNER_TEMP/Nemo-QA-Full.json" --report "$RUNNER_TEMP/nemo-review/browser.json"
      - uses: actions/checkout@v4
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: native-host
          persist-credentials: false
      - name: Prepare disposable native host
        run: |
          touch native-host/.nemo-ci-host
          npm ci --prefix native-host --no-audit --no-fund
      - name: Native SillyTavern acceptance
        run: python tests/recipe-native-smoke.py --st native-host --preset "$RUNNER_TEMP/Nemo-QA-Full.json" --report "$RUNNER_TEMP/nemo-review/native.json"
      - name: Review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nemo-recipe-review
          path: ${{ runner.temp }}/nemo-review/
          retention-days: 7
